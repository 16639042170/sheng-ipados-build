name: cancel stale sheng macOS runs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-stale.yml']

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in 44649672111 44649774209; do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
