name: diag-wifi

on:
  push:
    paths:
      - .github/workflows/diag-wifi.yml
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: c8f92b208068eeaa4cd2b0f592671f04ee70076e
          path: device
          submodules: recursive
      - name: fetch sources and capture the error
        working-directory: device/drivers/Ath12kWifi
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diag"
          set +e
          {
            echo "pwd=$(pwd)"
            git submodule status || true
            python3 tools/fetch-sources.py
          } > "$GITHUB_WORKSPACE/diag/fetch.log" 2>&1
          echo "rc=$?" >> "$GITHUB_WORKSPACE/diag/fetch.log"
          tail -120 "$GITHUB_WORKSPACE/diag/fetch.log"
      - uses: actions/upload-artifact@v4
        with:
          name: diag-wifi
          retention-days: 1
          path: diag
