name: inspect macos logs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/log-inspect.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-logs
          run-id: 44466962242
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: logs
      - name: Show prelink tail
        run: |
          for f in $(find logs -name prelink.log); do echo "=== $f"; tail -200 "$f"; done
      - name: Commit inspected logs
        run: |
          f=$(find logs -name prelink.log | head -1)
          cp "$f" inspected-prelink.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspected-prelink.log
          git commit -m 'capture run 16 prelink log'
          git push
