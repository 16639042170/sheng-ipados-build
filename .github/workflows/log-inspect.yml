name: inspect macos logs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/log-inspect.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-logs
          run-id: 44427690964
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: logs
      - name: Show prelink and kernel tails
        run: |
          find logs -type f | sort | head -80
          for f in $(find logs -name prelink.log); do echo "=== $f"; cat "$f"; done
          for f in $(find logs -name kernel.log); do echo "=== tail $f"; tail -40 "$f"; done
      - name: Commit inspected logs
        run: |
          f=$(find logs -name prelink.log | head -1)
          cp "$f" inspected-prelink.log
          k=$(find logs -name kernel.log | head -1)
          tail -80 "$k" > inspected-kernel-tail.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspected-prelink.log inspected-kernel-tail.log
          git commit -m 'capture run 11 prelink and kernel logs'
          git push
