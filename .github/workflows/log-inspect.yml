name: inspect macos logs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/log-inspect.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-logs
          run-id: 44482775713
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: logs
      - name: Show files and tails
        run: |
          find logs -type f -maxdepth 3 -printf '%p %s\n'
          for f in $(find logs -type f); do echo "=== $f"; tail -240 "$f"; done > build-logs.txt
      - name: Commit inspected logs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add build-logs.txt
          git commit -m 'capture all run 18 build logs'
          git push
