name: inspect macos logs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/log-inspect.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patch-debug
          run-id: 44514099851
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: logs
      - name: Capture patch report
        run: |
          find logs -type f -maxdepth 3 -printf '%p %s\n'
          cat logs/patch-report.txt > patch-report.txt
      - name: Commit inspected logs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add patch-report.txt
          git commit -m 'capture patch debug report'
          git push
