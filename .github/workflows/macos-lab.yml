name: sheng macOS lab

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UniXNU core branch or commit
        type: string
        default: 563595abedfdfa413ad583b66b6176d82007e633
      device_ref:
        description: UniXNU-sheng device branch or commit
        type: string
        default: c8f92b208068eeaa4cd2b0f592671f04ee70076e
  push:
    branches: [macos-lab]
    paths:
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: sheng-macos-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_IPSW_JOBS: 16
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      CCACHE: ${{ github.workspace }}/compile-records.py
      CORE_REF: ${{ inputs.core_ref || '563595abedfdfa413ad583b66b6176d82007e633' }}
      DEVICE_REF: ${{ inputs.device_ref || 'c8f92b208068eeaa4cd2b0f592671f04ee70076e' }}
    steps:
      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: ${{ env.DEVICE_REF }}
          path: device
          submodules: recursive
      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.CORE_REF }}
          path: UniXNU
          submodules: recursive
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 8156d2e54a9f57818dc8b415a1a7dc28ad9ba4be
          path: uefi-sheng
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check secrets
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: Restore build inputs
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sheng-macos27-build-v1-${{ runner.os }}-
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Refresh pinned translator checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pin = json.loads((core / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']['commit']
          source = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference/metal2vulkan'
          signature = hashlib.sha256((pin + '\n').encode() + (core / 'scripts/build-adreno-metal-bridge.py').read_bytes() + b''.join(path.read_bytes() for path in sorted((core / 'drivers/AdrenoMetal/bridge/patches').glob('*.patch')))).hexdigest()
          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Install build tools
        run: |
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PYTHON'
          from pathlib import Path
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (toolchain / name).symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install compile-record hook
        run: |
          cat > "$GITHUB_WORKSPACE/compile-records.py" <<'PYTHON'
          #!/usr/bin/env python3
          """Record every XNU compile as <object>.json, then run the compiler.

          XNU's makedefs set KCC = $(CCACHE) $(CC) and leave CCACHE to the
          build that drives it. The archive builders re-run one compile from
          the record beside that object, with the exact flags the kernel used.
          """
          import json
          import os
          import sys

          SOURCE_SUFFIXES = ('.c', '.cc', '.cpp', '.cxx', '.m', '.mm')


          def source_argument(args):
              found = None
              skip = False
              for value in args:
                  if skip:
                      skip = False
                      continue
                  if value in ('-o', '-MF', '-MT', '-MQ', '-include', '-imacros', '-isystem',
                               '-I', '-D', '-U'):
                      skip = True
                      continue
                  if value.startswith('-'):
                      continue
                  if value.endswith(SOURCE_SUFFIXES):
                      found = value
              return found


          def object_argument(args, source):
              for index, value in enumerate(args):
                  if value == '-o' and index + 1 < len(args):
                      return args[index + 1], args
                  if value.startswith('-o') and len(value) > 2:
                      return value[2:], args
              name = os.path.basename(source)
              name = name[:name.rfind('.')] + '.o'
              return name, args + ['-o', name]


          def main(argv):
              if len(argv) < 2:
                  raise SystemExit('usage: compile-records.py COMPILER [ARGS...]')
              compiler = argv[1]
              args = argv[2:]
              if '-c' not in args:
                  os.execv(compiler, [compiler] + args)
              source = source_argument(args)
              if source is None:
                  os.execv(compiler, [compiler] + args)
              target, args = object_argument(args, source)
              if not os.path.isabs(target):
                  target = os.path.join(os.getcwd(), target)
              record = {
                  'directory': os.getcwd(),
                  'file': source,
                  'arguments': [compiler] + args,
              }
              os.makedirs(os.path.dirname(target) or '.', exist_ok=True)
              with open(target + '.json', 'w', encoding='utf-8') as stream:
                  json.dump(record, stream)
                  stream.write('\n')
              os.execv(compiler, [compiler] + args)


          if __name__ == '__main__':
              main(sys.argv)
          PYTHON
          chmod +x "$GITHUB_WORKSPACE/compile-records.py"
      - name: Prime locked Wi-Fi sources
        run: |
          python3 - <<'PYTHON'
          import json, shutil, subprocess
          from pathlib import Path
          root = Path('device/drivers/Ath12kWifi')
          lock = json.loads((root / 'tools/source-lock.json').read_text())
          for name in ('linux', 'freebsd'):
              source = lock[name]
              directory = root / 'deps' / name
              if directory.exists():
                  shutil.rmtree(directory)
              directory.parent.mkdir(parents=True, exist_ok=True)
              if name == 'linux':
                  subprocess.run(['git', 'clone', '-q', '--depth', '1', '--branch', source['ref'],
                                  '--filter=blob:none', '--sparse', source['url'], str(directory)], check=True)
              else:
                  subprocess.run(['git', 'clone', '-q', '--depth', '1', '--filter=blob:none', '--sparse',
                                  '--no-checkout', source['url'], str(directory)], check=True)
                  subprocess.run(['git', '-C', str(directory), 'fetch', '-q', '--depth', '1',
                                  '--filter=blob:none', 'origin', source['commit']], check=True)
                  subprocess.run(['git', '-C', str(directory), 'checkout', '-q', '--detach', 'FETCH_HEAD'], check=True)
              revision = subprocess.check_output(['git', '-C', str(directory), 'rev-parse', 'HEAD'], text=True).strip()
              print(name, revision)
              if revision != source['commit']:
                  raise SystemExit(f'{name}: expected {source["commit"]}, found {revision}')
          PYTHON
      - name: Identify kernel SDK cache
        id: kernel-sdk
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          from pathlib import Path
          version = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'])
          key = 'sheng-macos27-kernel-v1-' + hashlib.sha256(version).hexdigest()[:16]
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=' + key + '\n')
          PYTHON
      - name: Restore kernel compile records
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.kernel-sdk.outputs.key }}-
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
      - name: Generate lab password
        run: |
          python3 - <<'PYTHON'
          import os, secrets, string
          password = ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(16))
          print(f'::add-mask::{password}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('UNIXNU_LAB_PASSWORD=' + password + '\n')
          os.makedirs('artifacts', exist_ok=True)
          with open('artifacts/lab-password.txt', 'w') as output:
              output.write(password + '\n')
          PYTHON
      - name: Prepare installation
        working-directory: UniXNU
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          board = Path('../device/board.toml')
          text = board.read_text()
          needle = '"component:ShengUfs", "component:RamBlock", "component:Adreno740", "fetch-sheng-dts.py"'
          replacement = ('"component:ShengUfs", '
                         '"build-sheng-source-storage.py --policy-dir scripts/policies/macos-27.3-26C5035r", '
                         '"component:RamBlock", "component:Adreno740", "fetch-sheng-dts.py"')
          if needle in text:
              board.write_text(text.replace(needle, replacement, 1))
              print('macOS source-storage archive added to board.toml')
          elif 'build-sheng-source-storage.py --policy-dir scripts/policies/macos-27.3-26C5035r' not in text:
              raise SystemExit('macOS archives list not found in board.toml')
          PYTHON
          ./unixnu defconfig sheng_macos_defconfig -D ../device --os macos-27
          ./unixnu fetch --os macos-27
          python3 ../device/scripts/prepare-macos-install.py
      - name: Install prelink watcher
        run: |
          cat > "$GITHUB_WORKSPACE/watch_prelink.py" <<'PYTHON'
          #!/usr/bin/env python3
          from pathlib import Path
          import os, time
          ROOT = Path(os.environ['GITHUB_WORKSPACE']) / 'UniXNU' / 'out'
          HELPER = r'''
          def trim_native_text(native):
              # TRIM_NATIVE_TEXT: the sheng kernel's native __TEXT is slightly larger
              # than the only free __PRELINK_TEXT window. Drop trailing unwind metadata
              # or page padding, never live text or data.
              text = next((s for s in native.segments if s['name'] == '__TEXT'), None)
              if text is None:
                  return None
              sections = [s for s in native.sections if s['segment'] == '__TEXT' and s['size']]
              if not sections:
                  return None
              last = max(sections, key=lambda s: s['va'] + s['size'])
              end = last['va'] + last['size'] - text['va']
              old = text['size']
              if old > end:
                  text['size'] = end
                  text['filesize'] = min(text['filesize'], end)
                  print(f'prelink: trimmed __TEXT padding {old:#x} -> {end:#x}')
                  return old - end
              if last['name'] == '__eh_frame' and last['size'] >= 0x1e8:
                  before = max((s['va'] + s['size'] for s in sections if s is not last), default=text['va'])
                  text['size'] = before - text['va']
                  text['filesize'] = min(text['filesize'], text['size'])
                  last['size'] = 0
                  print(f'prelink: dropped __TEXT,__eh_frame {old:#x} -> {text["size"]:#x}')
                  return old - text['size']
              print(f'prelink: no safe __TEXT trim: size {old:#x}, last {last["name"]} ends {end:#x}')
              return None
          '''
          def patch(path):
              text = path.read_text(encoding='utf-8')
              if 'TRIM_NATIVE_TEXT' in text:
                  return
              text = text.replace('class Layout:', HELPER + '\n\nclass Layout:', 1)
              text = text.replace('        self.cache, self.native = cache, native\n',
                                  '        trim_native_text(native)\n        self.cache, self.native = cache, native\n', 1)
              path.write_text(text, encoding='utf-8')
              print('prelink watcher patched', path, flush=True)
          while True:
              patched = False
              for path in ROOT.rglob('fileset_layout.py'):
                  try:
                      patch(path)
                      patched = True
                  except Exception as error:
                      print('prelink watcher retry:', error, flush=True)
              if patched:
                  break
              time.sleep(0.5)
          PYTHON
          chmod +x "$GITHUB_WORKSPACE/watch_prelink.py"
          python3 - <<'PYTHON'
          from pathlib import Path
          package = Path('device/scripts/package.sh')
          text = package.read_text()
          needle = 'set -euo pipefail\n'
          insert = 'set -euo pipefail\n\npython3 "$GITHUB_WORKSPACE/watch_prelink.py" &\n'
          if 'watch_prelink.py' not in text:
              if needle not in text:
                  raise SystemExit('package.sh header not found')
              package.write_text(text.replace(needle, insert, 1))
              print('prelink watcher started by package.sh')
          else:
              print('package.sh already has prelink watcher')
          PYTHON
      - name: Build images
        id: build-images
        working-directory: device
        run: scripts/package.sh --os macos-27 --uefi ../uefi-sheng
      - name: Inspect native kernel
        if: always()
        run: |
          python3 - <<'PYTHON'
          import struct
          from pathlib import Path
          matches = list(Path('UniXNU/out').glob('sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf'))
          print('native kernels:', matches)
          for path in matches:
              data = path.read_bytes()
              print(path, len(data))
              magic, cpu, _, kind, count, size = struct.unpack_from('<6I', data, 0)
              print('header', hex(magic), hex(cpu), kind, count, size)
              off = 32
              for _ in range(count):
                  cmd, length = struct.unpack_from('<II', data, off)
                  if cmd == 0x19:
                      name, va, vsize, foff, fsize = struct.unpack_from('<16s4Q', data, off + 8)
                      name = name.rstrip(b'\0').decode()
                      print(f'segment {name} va={va:#x} vmsize={vsize:#x} fileoff={foff:#x} filesize={fsize:#x}')
                      if name == '__TEXT':
                          nsects, = struct.unpack_from('<I', data, off + 64)
                          for index in range(nsects):
                              s = off + 72 + 80 * index
                              sect, seg = (data[s+i:s+i+16].rstrip(b'\0').decode() for i in (0, 16))
                              sva, ssize = struct.unpack_from('<QQ', data, s + 32)
                              print(f'  section {seg},{sect} va={sva:#x} size={ssize:#x}')
                  off += length
          PYTHON
      - name: Publish shader inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-inventory
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.txt
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.json
          retention-days: 1
      - name: Build root storage
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['build', 'userdata', '-D', '../device', '--os', 'macos-27']))
          objects = []
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              objects += ['--object', f'{name}.vroot={ctx.tree}/build/verified-root-{name}/hashes.bin']
          subprocess.run(['./unixnu', 'build', 'userdata', '--os', 'macos-27', *objects], check=True)
          PY
      - name: Stage device artifacts
        run: |
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          cp "$target/boot/boot.img" "$target/payload/payload.img" "$target/kernel/kernel.macho" "$target/package.manifest.json" artifacts/
          cp "$target/runtime/data.dbr" artifacts/
          cp "$target/tree/build/prime-list.txt" "$target/tree/build/prime-list.json" artifacts/
          cp "$target/userdata/userdata-root.json" artifacts/
          zstd -T0 -3 --sparse "$target/userdata/userdata-root.img" -o artifacts/userdata-root.img.zst
      - name: Write summary
        run: |
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          {
            echo '## sheng macOS 27.3 images'
            echo ''
            echo '| file | bytes |'
            echo '| --- | --- |'
            for f in artifacts/boot.img artifacts/payload.img artifacts/kernel.macho artifacts/data.dbr artifacts/userdata-root.img.zst; do
              echo "| $(basename "$f") | $(stat -f %z "$f") |"
            done
            echo ''
            echo 'Flash file: `boot.img` plus `userdata-root.img` (decompress the `.zst` first).'
            echo 'The macOS administrator password is in `lab-password.txt` of this artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-macos-27
          path: artifacts/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-kernel
          path: |
            UniXNU/out/sheng/*/*/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log
            UniXNU/out/sheng/*/*/tree/build/prime-list.*
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.log
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.command.json
          retention-days: 1
      - name: Save build inputs
        if: always() && steps.build-images.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Save kernel compile records
        if: always() && steps.build-images.outcome == 'success' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
