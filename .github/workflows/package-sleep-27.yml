name: package-sleep-27

# scripts/package.sh of the pinned device checkout on a macOS runner, with the UniXNU 2026-11-18
# pin (ArmCpu sleep #299 + AdrenoMetal sleep) and --kernel-arg platform-sleep=1. Upstream pins
# the R2507 translator whose copied.rs defines read_pages only for linux/macos, so the iOS
# target fails to compile; one step widens that cfg to ios. The Ath12kWifi submodule keeps its
# supplicant sources out of the checkout and its FreeBSD lock has drifted from releng/15.1;
# one step clones and checks out the locked commits. Touch/Keyboard/Video firmware comes from
# proprietary-files.txt's mirror. Two boot-log diagnostic patches no longer apply to this
# kernel and are dropped from the series; the sleep patch stays. Geni SPI is a submodule of the
# kernel, so the package tree (a git archive) has no drivers/QcomGeniSpi: its headers are copied
# next to TouchProbe and every build-script reference is rewritten to the workspace submodule.
# Board sources compile with -Werror and some of their file-scope constants and helpers are only
# read by blocks an iOS build compiles out; those declarations are prefixed with maybe_unused.
# package.sh is teed into build-logs so a silent death still leaves its last lines and a df
# snapshot.
on:
  push:
    paths:
      - .github/workflows/package-sleep-27.yml
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-sleep-27
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: c8f92b208068eeaa4cd2b0f592671f04ee70076e
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 519d80242a5028ee123447b01bc3b809baed565f
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '-27\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}
      - name: prepare preserved Data seed
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          raw = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          inputs = raw.get('inputs') or {}
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ.get('INIT_DATA', 'false') != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: proprietary firmware (Touch, Keyboard, Video)
        working-directory: device
        run: python3 scripts/extract-files.py
      - name: Ath12kWifi supplicant sources
        working-directory: device/drivers/Ath12kWifi
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          lock = json.load(open('tools/source-lock.json'))
          for name in ('linux', 'freebsd'):
              source, directory = lock[name], 'deps/' + name
              if not os.path.isdir(directory):
                  subprocess.run(['git', 'clone', '--depth', '1', '--branch', source['ref'], '--filter=blob:none',
                                  '--sparse', source['url'], directory], check=True)
              head = subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
              print(name, 'cloned HEAD', head, 'locked', source['commit'])
              if head != source['commit']:
                  subprocess.run(['git', '-C', directory, 'fetch', '--depth', '1', 'origin', source['commit']], check=True)
                  subprocess.run(['git', '-C', directory, 'checkout', '--detach', 'FETCH_HEAD'], check=True)
                  head = subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
                  print(name, 'pinned HEAD', head)
          PY
          python3 tools/fetch-sources.py
      - name: let the Metal bridge read its own pages on iOS
        run: |
          python3 - <<'PY'
          import pathlib
          script = pathlib.Path('UniXNU/scripts/build-adreno-metal-bridge.py')
          text = script.read_text()
          marker = "out = ROOT / 'build/adreno-metal-bridge'"
          addition = (
              "copied = SOURCE / 'crates/metal2vulkan-runtime/src/copied.rs'\n"
              "copied_text = copied.read_text()\n"
              "copied_text = copied_text.replace('#[cfg(target_os = \"macos\")]\\npub(crate) fn read_pages', '#[cfg(any(target_os = \"macos\", target_os = \"ios\"))]\\npub(crate) fn read_pages')\n"
              "copied.write_text(copied_text)\n"
          )
          if 'copied_text = copied.read_text()' not in text:
              text = text.replace(marker, addition + marker, 1)
          script.write_text(text)
          print('patched build-adreno-metal-bridge.py:', 'copied_text' in text)
          PY
      - name: point every build script at the real Geni SPI sources
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          header = ("import os\n"
                     "from pathlib import Path as _GeniPath\n"
                     "QCOM_GENI_SPI = _GeniPath(os.environ['GITHUB_WORKSPACE']) / 'UniXNU/drivers/QcomGeniSpi'\n")
          touched = []
          for script in sorted(pathlib.Path('UniXNU/scripts').glob('build-*.py')):
              text = script.read_text()
              if 'drivers/QcomGeniSpi' not in text:
                  continue
              body = re.sub(r"ROOT\s*/\s*'drivers/QcomGeniSpi/([^']+)'", r"QCOM_GENI_SPI / '\1'", text)
              body = re.sub(r"ROOT\s*/\s*'drivers/QcomGeniSpi'", 'QCOM_GENI_SPI', body)
              if 'drivers/QcomGeniSpi' in body:
                  print('left over in', script.name, file=sys.stderr)
                  sys.exit(1)
              lines = body.splitlines(True)
              start = 1 if lines and lines[0].startswith('#!') else 0
              lines.insert(start, header)
              script.write_text(''.join(lines))
              touched.append(script.name)
          if not touched:
              sys.exit('no build script referenced drivers/QcomGeniSpi')
          print('patched:', ', '.join(touched))
          PY
          cp UniXNU/drivers/QcomGeniSpi/*.h device/package/
          ls -l device/package/GeniSpi.h
      - name: mark board constants and helpers this variant compiles out
        run: |
          python3 - <<'PY'
          import pathlib, re
          types = r'(?:static\s+)?(?:bool|int|void|uint32_t|uint64_t|int32_t|int64_t|size_t|IOReturn|const char \*)\s+\w+\s*\('
          for cpp in sorted(pathlib.Path('device/package').glob('*.cpp')):
              text = cpp.read_text()
              before = text
              text = re.sub(r'^constexpr ', '[[maybe_unused]] constexpr ', text, flags=re.M)
              text = re.sub(r'^(' + types + r')', r'[[maybe_unused]] \1', text, flags=re.M)
              text = re.sub(r'^(static const char \w+\[\])(.*)$', r'\1 __attribute__((unused))\2', text, flags=re.M)
              if text != before:
                  cpp.write_text(text)
                  print(cpp.name, 'patched')
          PY
          grep -c "maybe_unused" device/package/ShengSleep.cpp device/package/SourceStorage.cpp
      - name: drop the two boot-log patches that no longer apply
        run: |
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('device/patches/xnu-12377/series')
          dropped = ('sheng-startup-failure-log.patch', 'sheng-process-exit-log.patch')
          kept = [line for line in path.read_text().splitlines() if not any(name in line for name in dropped)]
          path.write_text('\n'.join(kept).rstrip('\n') + '\n')
          print(path.read_text())
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          log="$GITHUB_WORKSPACE/package.log"
          {
            echo "=== start $(date -u) ==="
            sw_vers
            df -h /
            vm_stat | head -6
          } > "$log" 2>&1
          args=(--os "${OS_PROFILE:-27}" --uefi ../uefi-sheng --kernel-arg platform-sleep=1)
          if [ "${INIT_DATA:-false}" = true ]; then
            args+=(--init-data)
          fi
          set +e
          scripts/package.sh "${args[@]}" >> "$log" 2>&1
          rc=$?
          {
            echo "=== package exit $rc at $(date -u) ==="
            df -h /
            vm_stat | head -6
          } >> "$log" 2>&1
          tail -40 "$log"
          exit $rc
      - uses: actions/cache/save@v4
        if: always() && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}
      - name: installation seed backup
        if: always() && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-27
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: redact build logs
        if: always()
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          mkdir -p build-logs
          [ -f "$GITHUB_WORKSPACE/package.log" ] && cp "$GITHUB_WORKSPACE/package.log" build-logs/package.log
          for d in UniXNU/out/sheng/*/*/logs; do
            [ -d "$d" ] && cp -R "$d"/. build-logs/
          done
          for f in UniXNU/out/sheng/*/*/tree/build/xnu/fileset-reference/*/*-build.log; do
            [ -f "$f" ] && cp "$f" "build-logs/fileset-reference-$(basename "$(dirname "$f")")-$(basename "$f")"
          done
          find build-logs -type f -exec sed -i '' "s/$SEED/********/g" {} + 2>/dev/null || true
      - name: build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-27
          retention-days: 1
          if-no-files-found: ignore
          path: build-logs
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-27
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
