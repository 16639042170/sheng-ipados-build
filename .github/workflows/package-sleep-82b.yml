name: package-sleep-82b
on:
  push:
    paths:
      - .github/workflows/package-sleep-82b.yml
      - ci/**
  workflow_dispatch:
    inputs:
      init_data:
        description: "Create a NEW installation seed if no saved seed exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: package-sleep-82b
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: c8f92b208068eeaa4cd2b0f592671f04ee70076e
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9
          path: UniXNU
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: uefi-sheng
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: 16639042170/sheng-ipados-build
          ref: build/sleep-27
          path: ci-repo
      - name: open the build log
        run: |
          log="$GITHUB_WORKSPACE/package.log"
          { echo "=== markers $(date -u) ==="; echo "[marker] checkouts"; } > "$log"
      - name: cherry-pick the two sleep commits
        working-directory: UniXNU
        run: |
          echo "[marker] cherry-pick $(date -u)" >> "$GITHUB_WORKSPACE/package.log"
          set -e
          git config user.email ci@local
          git config user.name ci
          git fetch --filter=blob:none origin main:refs/remotes/origin/main
          for c in 90873392b74445c75a15d48769bd570322b8136a 099c72fd; do
            if [ "$(git rev-list --parents -n1 $c | wc -w)" -gt 2 ]; then
              git cherry-pick -m 1 "$c" || true
            else
              git cherry-pick "$c" || true
            fi
            if [ -f .git/CHERRY_PICK_HEAD ]; then
              for sub in $(git diff --name-only --diff-filter=U); do
                case "$sub" in
                  components.toml) git checkout --theirs -- "$sub"; git add "$sub" ;;
                  *.py) git add "$sub" ;;
                  *) pointer=$(git ls-tree "$c" -- "$sub" | awk '{print $3}')
                     git -C "$sub" fetch --depth 1 origin "$pointer"
                     git -C "$sub" checkout "$pointer"
                     git add "$sub" ;;
                esac
              done
              git -c core.editor=true cherry-pick --continue
            fi
            git log --oneline -1 >> "$GITHUB_WORKSPACE/package.log" 2>&1
          done
          git ls-tree HEAD drivers/ArmCpu >> "$GITHUB_WORKSPACE/package.log"
          git ls-tree HEAD drivers/AdrenoMetal >> "$GITHUB_WORKSPACE/package.log"
      - name: tools
        run: |
          echo "[marker] tools $(date -u)" >> "$GITHUB_WORKSPACE/package.log"
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw >> "$GITHUB_WORKSPACE/package.log" 2>&1
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src >> "$GITHUB_WORKSPACE/package.log" 2>&1
          echo "[marker] tools done" >> "$GITHUB_WORKSPACE/package.log"
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          echo "[marker] platform seed" >> "$GITHUB_WORKSPACE/package.log"
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'UNIXNU_UNIQUE_CHIP_ID is not an 8 hex digit seed' >> "$GITHUB_WORKSPACE/package.log"
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '-27\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}
      - name: prepare preserved Data seed
        env:
          INIT_DATA: ${{ inputs.init_data }}
          CACHE_HIT: ${{ steps.data-cache.outputs.cache-hit }}
        run: |
          echo "[marker] seed step cache-hit=${CACHE_HIT:-unknown}" >> "$GITHUB_WORKSPACE/package.log"
          python3 - <<'PY' >> "$GITHUB_WORKSPACE/package.log" 2>&1
          import json, os, pathlib, urllib.request, zipfile, shutil
          runtime = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime')
          seed = runtime / 'data.dbr'
          if not seed.is_file():
              url = 'https://nightly.link/16639042170/sheng-ipados-build/actions/runs/44557722898/installation-seed-27.zip'
              print('cache miss: fetching the seed backup', url)
              tmp = pathlib.Path('seed-backup.zip')
              with urllib.request.urlopen(url, timeout=600) as r, open(tmp, 'wb') as f:
                  shutil.copyfileobj(r, f)
              with zipfile.ZipFile(tmp) as z:
                  names = [n for n in z.namelist() if n.endswith('data.dbr') or n.endswith('inputs.json')]
                  print('artifact members:', names)
                  for n in names:
                      target = runtime / pathlib.Path(n).name
                      runtime.mkdir(parents=True, exist_ok=True)
                      with z.open(n) as src, open(target, 'wb') as dst:
                          shutil.copyfileobj(src, dst)
                      print('restored', target, target.stat().st_size)
          print('seed present:', seed.is_file(), seed.stat().st_size if seed.is_file() else 0)
          if not seed.is_file() and os.environ.get('INIT_DATA', 'false') != 'true':
              raise SystemExit('No saved seed and init_data not selected')
          PY
      - name: proprietary firmware (Touch, Keyboard, Video)
        working-directory: device
        run: |
          echo "[marker] firmware" >> "$GITHUB_WORKSPACE/package.log"
          python3 scripts/extract-files.py >> "$GITHUB_WORKSPACE/package.log" 2>&1
      - name: Ath12kWifi supplicant sources
        working-directory: device/drivers/Ath12kWifi
        run: |
          echo "[marker] wifi sources" >> "$GITHUB_WORKSPACE/package.log"
          python3 - <<'PY' >> "$GITHUB_WORKSPACE/package.log" 2>&1
          import json, os, subprocess
          lock = json.load(open('tools/source-lock.json'))
          for name in ('linux', 'freebsd'):
              source, directory = lock[name], 'deps/' + name
              if not os.path.isdir(directory):
                  subprocess.run(['git', 'clone', '--depth', '1', '--branch', source['ref'], '--filter=blob:none',
                                  '--sparse', source['url'], directory], check=True)
              head = subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
              print(name, 'cloned HEAD', head, 'locked', source['commit'])
              if head != source['commit']:
                  subprocess.run(['git', '-C', directory, 'fetch', '--depth', '1', 'origin', source['commit']], check=True)
                  subprocess.run(['git', '-C', directory, 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
          python3 tools/fetch-sources.py >> "$GITHUB_WORKSPACE/package.log" 2>&1
      - name: pre-package fixups
        run: python3 ci-repo/ci/prepare-82b.py >> "$GITHUB_WORKSPACE/package.log" 2>&1
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          set +e
          log="$GITHUB_WORKSPACE/package.log"
          { echo "=== package start $(date -u) ==="; pwd; } >> "$log" 2>&1
          status="$GITHUB_WORKSPACE/status-heartbeat"
          git clone --quiet --depth 1 --branch build/sleep-27 \
            "https://x-access-token:$GITHUB_TOKEN@github.com/16639042170/sheng-ipados-build.git" "$status" 2>/dev/null
          publish() {
            [ -d "$status/.git" ] || return 0
            (
              cd "$status" || exit 0
              mkdir -p status
              tail -n 4000 "$log" > status/package-82b.log 2>/dev/null
              { echo "run: $GITHUB_RUN_ID"; echo "state: running"; echo "when: $(date -u)"; } > status/package-82b.txt
              git -c user.email=ci@local -c user.name=ci add status >/dev/null 2>&1
              git -c user.email=ci@local -c user.name=ci commit -q -m "build82b heartbeat $GITHUB_RUN_ID" >/dev/null 2>&1
              for attempt in 1 2 3; do
                git pull --quiet --rebase --depth 1 origin build/sleep-27 >/dev/null 2>&1
                git push --quiet origin HEAD:build/sleep-27 >/dev/null 2>&1 && exit 0
                git rebase --abort >/dev/null 2>&1
              done
            )
          }
          publish
          ( while :; do sleep 120; publish; done ) &
          hb=$!
          cd "$GITHUB_WORKSPACE/device"
          args=(--os 27 --uefi ../uefi-sheng --kernel-arg platform-sleep=1)
          if [ "${INIT_DATA:-false}" = true ]; then args+=(--init-data); fi
          scripts/package.sh "${args[@]}" >> "$log" 2>&1
          rc=$?
          { echo "=== package exit $rc at $(date -u) ==="; } >> "$log" 2>&1
          kill "$hb" 2>/dev/null
          tail -40 "$log"
          publish
          exit $rc
      - name: publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git clone --depth 1 --branch build/sleep-27 "https://x-access-token:$GITHUB_TOKEN@github.com/16639042170/sheng-ipados-build.git" status-repo
          cd status-repo
          mkdir -p status
          tail -n 6000 "$GITHUB_WORKSPACE/package.log" > status/package-82b.log 2>/dev/null
          { echo "run: $GITHUB_RUN_ID"; echo "conclusion: ${{ job.status }}"; echo "when: $(date -u)"; } > status/package-82b.txt
          git -c user.email=ci@local -c user.name=ci add status
          git -c user.email=ci@local -c user.name=ci commit -m "build82b: $GITHUB_RUN_ID ${{ job.status }}"
          for attempt in 1 2 3; do
            git pull --rebase --depth 1 origin build/sleep-27 >/dev/null 2>&1
            git push origin HEAD:build/sleep-27 && break
            git rebase --abort >/dev/null 2>&1
          done
      - name: images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-27-82b
          retention-days: 3
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
