name: preflight-patches
# Fast check of the 82b847c + sleep-cherry-pick direction. The kernel repo has no osfmk/ tree:
# XNU is fetched into .cache/xnu-work by the real build, so board patches can only be proven
# there. What this proves in a few minutes is the cherry-pick itself, including the submodule
# pointer conflict on drivers/ArmCpu, which is the part that would otherwise waste a 70-minute
# build. Transcript is uploaded as an artifact so it can be read without a token.
on:
  push:
    paths:
      - .github/workflows/preflight-patches.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9
          path: kernel
          fetch-depth: 0
          submodules: recursive
      - name: cherry-pick the sleep commits
        working-directory: kernel
        run: |
          set +e
          exec > >(tee -a "$GITHUB_WORKSPACE/preflight.log") 2>&1
          git config user.email ci@local
          git config user.name ci
          git fetch --filter=blob:none origin main:refs/remotes/origin/main
          echo "fetch rc=$?"
          for c in 90873392b74445c75a15d48769bd570322b8136a 099c72fd; do
            echo "== $c: $(git log --oneline -1 $c)"
            if [ "$(git rev-list --parents -n1 $c | wc -w)" -gt 2 ]; then
              git cherry-pick -m 1 "$c"
            else
              git cherry-pick "$c"
            fi
            rc=$?
            echo "cherry-pick rc=$rc"
            if [ $rc -ne 0 ]; then
              for sub in $(git diff --name-only --diff-filter=U); do
                echo "resolving submodule conflict: $sub"
                pointer=$(git ls-tree "$c" -- "$sub" | awk '{print $3}')
                echo "pointer $pointer"
                git -C "$sub" fetch --depth 1 origin "$pointer" || git -C "$sub" fetch origin
                git -C "$sub" checkout "$pointer"
                git add "$sub"
              done
              git status --short
              git -c core.editor=true cherry-pick --continue
              echo "continue rc=$?"
            fi
          done
          echo "HEAD: $(git log --oneline -1)"
          echo "ArmCpu: $(git ls-tree HEAD drivers/ArmCpu)"
          git status --short | head -20
      - name: transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight
          retention-days: 1
          path: preflight.log
          if-no-files-found: error
